name: v2 macos
on:
  push:
    branches: [v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-macos-${{ github.ref }}
  cancel-in-progress: true
# One job a test target: the whole suite takes over an hour on the runner's 4 cores. Each builds what it tests
# (scripts/test.sh builds everything first), so a build failure fails all three.
jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode
        # The Mac that builds main uses Xcode 27.2.
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
          node --version
          python3 --version
          sw_vers
          sysctl -n hw.ncpu
          csrutil status || true
      - name: Tests
        run: bash scripts/ci/macos-tests.sh 'VibePlatformTests|VibeCoreTests' 2>&1 | tee test.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-test-log-core
          path: test.log
          retention-days: 14
  host:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode
        # The Mac that builds main uses Xcode 27.2.
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
          node --version
          python3 --version
          sw_vers
          sysctl -n hw.ncpu
          csrutil status || true
      - name: Tests
        run: bash scripts/ci/macos-tests.sh VibeHostTests 2>&1 | tee test.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-test-log-host
          path: test.log
          retention-days: 14
  app:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode
        # The Mac that builds main uses Xcode 27.2.
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
          node --version
          python3 --version
          sw_vers
          sysctl -n hw.ncpu
          csrutil status || true
      - name: Tests
        run: bash scripts/ci/macos-tests.sh VibeSwitcherTests 2>&1 | tee test.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-test-log-app
          path: test.log
          retention-days: 14
