name: v2 macos
on:
  push:
    branches: [v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        # The Mac that builds main uses Xcode 27.2.
        run: |
          ls -d /Applications/Xcode*.app
          echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
          node --version
          sw_vers
      - name: Build
        run: swift build --build-system native --force-resolved-versions
      - name: Tests
        run: bash scripts/ci/macos-tests.sh 2>&1 | tee test.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-test-log
          path: test.log
          retention-days: 14
