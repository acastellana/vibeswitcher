    <script>
      // Shared, seek-safe tween helpers for every scene. Each takes the scene's own paused timeline.
      window.K = (function () {
        const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        return {
          fmt,
          // Fade the stage in and out, drift the ghost word, and pad the timeline to the scene's length.
          scene(tl, root, dur) {
            const st = root.querySelector(".stage");
            tl.fromTo(st, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
            tl.to(st, { opacity: 0, duration: 0.4, ease: "power1.in" }, dur - 0.45);
            const k = root.querySelector(".kicker");
            if (k) tl.fromTo(k, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.15);
            const g = root.querySelector(".ghost");
            if (g) tl.fromTo(g, { x: 80 }, { x: -80, duration: dur, ease: "none" }, 0);
            tl.set({}, {}, dur);
          },
          // Stretch a scene built for `base` seconds to `dur` (its narrated length): every beat keeps its place
          // relative to the scene, so the reveals keep pace with the voice. Stretches in place (each top-level child
          // starts f times later and runs f times longer) and returns the same timeline, to register.
          fit(tl, base, dur) {
            const f = dur / base;
            if (Math.abs(f - 1) < 0.0001) return tl;
            tl.getChildren(false, true, true).forEach((c) => {
              c.startTime(c.startTime() * f);
              c.timeScale(c.timeScale() / f);
            });
            tl.set({}, {}, dur);
            return tl;
          },
          rise(tl, t, at, o = {}) {
            return tl.fromTo(
              t,
              { opacity: 0, y: o.y ?? 28 },
              { opacity: 1, y: 0, duration: o.d ?? 0.55, ease: o.ease ?? "power3.out", stagger: o.stagger ?? 0 },
              at,
            );
          },
          slide(tl, t, at, o = {}) {
            return tl.fromTo(
              t,
              { opacity: 0, x: o.x ?? -50 },
              { opacity: 1, x: 0, duration: o.d ?? 0.6, ease: o.ease ?? "expo.out", stagger: o.stagger ?? 0 },
              at,
            );
          },
          pop(tl, t, at, o = {}) {
            return tl.fromTo(
              t,
              { opacity: 0, scale: o.from ?? 0.6 },
              { opacity: 1, scale: 1, duration: o.d ?? 0.55, ease: o.ease ?? "back.out(1.7)", stagger: o.stagger ?? 0 },
              at,
            );
          },
          // Paths carry pathLength="1": draw from 0 to 1 without measuring.
          draw(tl, t, at, dur, o = {}) {
            return tl.fromTo(
              t,
              { strokeDasharray: 1, strokeDashoffset: 1 },
              { strokeDashoffset: 0, duration: dur, ease: o.ease ?? "power2.inOut", stagger: o.stagger ?? 0 },
              at,
            );
          },
          count(tl, el, to, at, dur, o = {}) {
            const p = { v: 0 };
            const pre = o.pre ?? "",
              post = o.post ?? "";
            el.textContent = pre + "0" + post;
            return tl.to(
              p,
              {
                v: to,
                duration: dur,
                ease: o.ease ?? "power2.out",
                onUpdate() {
                  el.textContent = pre + fmt(Math.round(p.v)) + post;
                },
              },
              at,
            );
          },
          type(tl, el, text, at, dur) {
            const p = { n: 0 };
            el.textContent = "";
            return tl.to(
              p,
              {
                n: text.length,
                duration: dur,
                ease: "none",
                onUpdate() {
                  el.textContent = text.slice(0, Math.round(p.n));
                },
              },
              at,
            );
          },
          breathe(tl, t, dur, o = {}) {
            const cycle = o.cycle ?? 3;
            const reps = Math.max(0, Math.floor(dur / cycle) - 1);
            return tl.fromTo(
              t,
              { scale: 1 },
              { scale: o.to ?? 1.06, duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
              0,
            );
          },
        };
      })();
