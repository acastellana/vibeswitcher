<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .s18 .head {
          position: absolute;
          left: 120px;
          top: 130px;
        }
        .s18 .tbl {
          position: absolute;
          left: 120px;
          top: 240px;
          width: 1680px;
        }
        .s18 .tr {
          display: grid;
          grid-template-columns: 230px 1fr 1fr;
          gap: 30px;
          align-items: center;
          min-height: 76px;
          border-top: 2px solid var(--line);
        }
        .s18 .tr.hd {
          min-height: 50px;
          border-top: none;
        }
        .s18 .tr .topic {
          font-family: var(--mono);
          font-weight: 700;
          font-size: 22px;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 0.06em;
        }
        .s18 .tr .a {
          font-size: 24px;
          line-height: 1.3;
          color: var(--muted);
        }
        .s18 .tr .b {
          font-size: 24px;
          line-height: 1.3;
          color: var(--fg);
          padding-left: 20px;
          border-left: 4px solid var(--accent);
        }
        .s18 .tr.hd .a,
        .s18 .tr.hd .b {
          font-family: var(--display);
          font-size: 30px;
          border-left: none;
          padding-left: 0;
        }
        .s18 .tr.hd .b {
          color: var(--accent);
          padding-left: 24px;
        }
        .s18 .note {
          position: absolute;
          left: 120px;
          top: 960px;
          width: 1680px;
          font-size: 25px;
          color: var(--muted);
        }
      </style>
      <div id="root" data-composition-id="s18-compare" data-width="1920" data-height="1080">
        <div class="stage s18">
          <div class="kicker">16 / What the system adds</div>
          <div class="head h2">Same sessions, plus a process.</div>
          <div class="tbl">
            <div class="tr hd"><span></span><span class="a">By hand, with Claude Code</span><span class="b">With VibeSwitcher on top</span></div>
            <div class="tr"><span class="topic">Planning</span><span class="a">You write each prompt</span><span class="b">Contracts with acceptance checks, on a board</span></div>
            <div class="tr"><span class="topic">Parallel</span><span class="a">You start worktrees and keep sessions apart</span><span class="b">A worktree and branch per task, a few at a time</span></div>
            <div class="tr"><span class="topic">Review</span><span class="a">You read the diffs, or ask a subagent to</span><span class="b">Risk check, then an independent verifier on another model</span></div>
            <div class="tr"><span class="topic">Merging</span><span class="a">You decide when it's tested enough</span><span class="b">Exact commit, full suite, fast-forward; flakes handled</span></div>
            <div class="tr"><span class="topic">Mistakes</span><span class="a">You remember next time</span><span class="b">Each incident becomes a check</span></div>
            <div class="tr"><span class="topic">The Mac</span><span class="a">You watch the load and the usage limits</span><span class="b">Shared slots, load, battery and usage holds</span></div>
            <div class="tr"><span class="topic">Memory</span><span class="a">CLAUDE.md and auto memory</span><span class="b">Plus decisions, receipts and provenance, in git</span></div>
            <div class="tr"><span class="topic">Your time</span><span class="a">You're in every loop</span><span class="b">You're asked only what's yours to decide</span></div>
          </div>
          <div class="note">Same Claude Code underneath: its permission rules, hooks and status line are how VibeSwitcher works.</div>
        </div>
      </div>
      <script>
        (function () {
          const S = document.querySelector(".s18");
          const tl = gsap.timeline({ paused: true });
          K.scene(tl, S.parentElement, 24);
          K.rise(tl, ".s18 .head", 0.3);
          K.rise(tl, ".s18 .tr.hd", 0.9);
          const rows = S.querySelectorAll(".tr:not(.hd)");
          rows.forEach((r, i) => {
            const at = 1.6 + i * 2.0;
            tl.fromTo(r.querySelector(".topic"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, at);
            tl.fromTo(r.querySelector(".a"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, at + 0.1);
            tl.fromTo(r.querySelector(".b"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, at + 0.8);
          });
          K.rise(tl, ".s18 .note", 18.4);
          window.__timelines["s18-compare"] = K.fit(tl, 24, 32.5);
        })();
      </script>
    </template>
  </body>
</html>
