<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .s06 .head {
          position: absolute;
          left: 120px;
          top: 130px;
          width: 1680px;
        }
        .s06 .lane {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        .s06 .st {
          position: absolute;
          top: 300px;
          width: 300px;
        }
        .s06 .st .dot {
          width: 34px;
          height: 34px;
          border-radius: 50%;
          background: var(--panel);
          border: 4px solid var(--accent);
          margin-bottom: 24px;
        }
        .s06 .st .k {
          font-family: var(--mono);
          font-weight: 700;
          font-size: 24px;
          color: var(--accent);
          margin-bottom: 8px;
        }
        .s06 .st .d {
          font-size: 24px;
          line-height: 1.32;
          color: var(--muted);
        }
        .s06 .report {
          position: absolute;
          left: 760px;
          top: 610px;
          width: 1040px;
          border-color: var(--go);
        }
        .s06 .report .k {
          font-family: var(--mono);
          font-weight: 700;
          font-size: 24px;
          color: var(--go);
          margin-bottom: 14px;
        }
        .s06 .report .row {
          font-size: 27px;
          line-height: 1.3;
          margin-bottom: 10px;
          display: flex;
          gap: 16px;
          align-items: baseline;
        }
        .s06 .report .row .n {
          flex: none;
          width: 16px;
          height: 16px;
          border-radius: 4px;
          background: var(--go);
        }
        .s06 .refuse {
          position: absolute;
          left: 120px;
          top: 650px;
          width: 560px;
          font-size: 30px;
          line-height: 1.32;
        }
        .s06 .refuse .stop {
          font-weight: 700;
        }
        .s06 .refuse .mono {
          display: block;
          margin-top: 20px;
          font-size: 21px;
          color: var(--muted);
        }
      </style>
      <div id="root" data-composition-id="s06-worker" data-width="1920" data-height="1080">
        <div class="stage s06">
          <div class="kicker">05 / Owned through completion</div>
          <div class="head h2">A worker owns its task to the end.</div>
          <svg class="lane" viewBox="0 0 1920 1080" aria-hidden="true">
            <path class="rail-hot" pathLength="1" d="M 137 317 L 1790 317" />
          </svg>
          <div class="st" style="left: 120px">
            <div class="dot"></div>
            <div class="k">progress</div>
            <div class="d">a milestone, on its task's line</div>
          </div>
          <div class="st" style="left: 455px">
            <div class="dot"></div>
            <div class="k">ask_lead</div>
            <div class="d">only direction, scope or risk</div>
          </div>
          <div class="st" style="left: 790px">
            <div class="dot"></div>
            <div class="k">affected tests</div>
            <div class="d">while editing; the merge runs the full suite</div>
          </div>
          <div class="st" style="left: 1125px">
            <div class="dot"></div>
            <div class="k">under load</div>
            <div class="d">new tests run beside busy loops first</div>
          </div>
          <div class="st st5" style="left: 1460px">
            <div class="dot"></div>
            <div class="k">report</div>
            <div class="d">done · blocked · over_budget</div>
          </div>
          <div class="refuse">
            <span class="stop">A done without evidence for every check is refused.</span>
            <span class="mono">routine calls it made itself are listed, not asked</span>
          </div>
          <div class="report card">
            <div class="k">report(status: done)</div>
            <div class="row"><span class="n"></span><span>evidence for every acceptance check: the command, what it printed</span></div>
            <div class="row"><span class="n"></span><span>a blind check: a fresh agent sees only the contract and the diff</span></div>
            <div class="row"><span class="n"></span><span>for a fix: its new test shown failing without it</span></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const S = document.querySelector(".s06");
          const tl = gsap.timeline({ paused: true });
          K.scene(tl, S.parentElement, 16);
          K.rise(tl, ".s06 .head", 0.3);
          K.draw(tl, ".s06 .lane path", 0.8, 5.4, { ease: "none" });
          tl.fromTo(".s06 .st", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 1.05 }, 0.9);
          tl.fromTo(".s06 .st .dot", { scale: 0.3 }, { scale: 1, duration: 0.5, ease: "back.out(3)", stagger: 1.05 }, 0.9);
          tl.to(".s06 .st5 .dot", { backgroundColor: "#7ccf8e", borderColor: "#7ccf8e", duration: 0.3 }, 5.4);
          K.pop(tl, ".s06 .report", 6.4, { from: 0.9 });
          K.slide(tl, ".s06 .report .row", 7.0, { stagger: 0.9, x: 24 });
          K.rise(tl, ".s06 .refuse .stop", 10.2);
          K.rise(tl, ".s06 .refuse .mono", 11.6);
          window.__timelines["s06-worker"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
