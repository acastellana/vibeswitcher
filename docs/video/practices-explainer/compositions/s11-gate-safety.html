<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .s11 .head {
          position: absolute;
          left: 120px;
          top: 130px;
        }
        .s11 .cards {
          position: absolute;
          left: 120px;
          top: 260px;
          width: 1680px;
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 28px;
        }
        .s11 .card {
          padding: 24px 30px;
          min-height: 330px;
        }
        .s11 .card .k {
          font-family: var(--mono);
          font-weight: 700;
          font-size: 26px;
          margin-bottom: 14px;
        }
        .s11 .card .d {
          font-size: 25px;
          line-height: 1.36;
          margin-bottom: 10px;
        }
        .s11 .card .d .mono {
          font-size: 22px;
          color: var(--accent);
        }
        .s11 .arrow {
          color: var(--muted);
          font-family: var(--mono);
        }
        .s11 .rec {
          position: absolute;
          left: 120px;
          top: 680px;
          width: 1680px;
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 28px;
          border-top: 2px solid var(--line);
          padding-top: 34px;
        }
        .s11 .rec .num {
          font-size: 92px;
          line-height: 1;
        }
        .s11 .rec .t {
          font-size: 23px;
          line-height: 1.3;
          color: var(--muted);
          margin-top: 12px;
          width: 360px;
        }
      </style>
      <div id="root" data-composition-id="s11-gate-safety" data-width="1920" data-height="1080">
        <div class="stage s11">
          <div class="kicker">09 / The merge gate</div>
          <div class="head h2">When the tests misbehave.</div>
          <div class="cards">
            <div class="card c1">
              <div class="k amber">Flaky</div>
              <div class="d">Failing tests run once more, up to 20 of them.</div>
              <div class="d"><span class="arrow">→</span> pass: merged, and each is recorded as a flake</div>
              <div class="d"><span class="arrow">→</span> 3 flakes in 7 days: a task to fix that test</div>
            </div>
            <div class="card c2">
              <div class="k stop">Hung</div>
              <div class="d">No new output and under 1 % of a core for 10 minutes, on a Mac that isn't overloaded:</div>
              <div class="d"><span class="arrow">→</span> stopped, naming the last test it started</div>
              <div class="d"><span class="mono">stall_min</span></div>
            </div>
            <div class="card c3">
              <div class="k info">Gate lag</div>
              <div class="d">The gate's own code runs from the installed app: new gate code on the base waits for an install.</div>
              <div class="d"><span class="arrow">→</span> status says so, and merges from the remote wait until then</div>
            </div>
          </div>
          <div class="rec">
            <div><div class="num go n1">0</div><div class="t">merges, each one tested at the gate</div></div>
            <div><div class="num amber n2">0</div><div class="t">passed only on the rerun: flakes, not failures</div></div>
            <div><div class="num n3">0</div><div class="t">tests in the largest suite run</div></div>
            <div><div class="num go n4">0</div><div class="t">reverts</div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const S = document.querySelector(".s11");
          const tl = gsap.timeline({ paused: true });
          K.scene(tl, S.parentElement, 18);
          K.rise(tl, ".s11 .head", 0.3);
          [".c1", ".c2", ".c3"].forEach((c, i) => {
            const at = 0.9 + i * 2.6;
            K.rise(tl, ".s11 " + c, at, { y: 36 });
            K.rise(tl, ".s11 " + c + " .d", at + 0.4, { stagger: 0.5, y: 12 });
          });
          K.rise(tl, ".s11 .rec > div", 9.6, { stagger: 0.3 });
          K.count(tl, S.querySelector(".n1"), 495, 9.8, 1.6);
          K.count(tl, S.querySelector(".n2"), 72, 10.1, 1.4);
          K.count(tl, S.querySelector(".n3"), 3986, 10.4, 1.6);
          tl.fromTo(".s11 .n4", { scale: 0.6 }, { scale: 1, duration: 0.6, ease: "back.out(2.4)" }, 10.9);
          window.__timelines["s11-gate-safety"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
