      <div id="captions-root" data-composition-id="captions" data-width="1920" data-height="1080">
        <div class="cg" id="cg-0"><span class="tx">One conversation,</span></div>
        <div class="cg" id="cg-1"><span class="tx">running a whole engineering team.</span></div>
        <div class="cg" id="cg-2"><span class="tx">This is how VibeSwitcher builds a working</span></div>
        <div class="cg" id="cg-3"><span class="tx">process around Claude Code sessions.</span></div>
        <div class="cg" id="cg-4"><span class="tx">Claude Code already gives you a lot:</span></div>
        <div class="cg" id="cg-5"><span class="tx">subagents, worktrees,</span></div>
        <div class="cg" id="cg-6"><span class="tx">hooks, permission rules,</span></div>
        <div class="cg" id="cg-7"><span class="tx">memory, even control from your phone.</span></div>
        <div class="cg" id="cg-8"><span class="tx">But run a few sessions by hand,</span></div>
        <div class="cg" id="cg-9"><span class="tx">and you become the process.</span></div>
        <div class="cg" id="cg-10"><span class="tx">You write every brief,</span></div>
        <div class="cg" id="cg-11"><span class="tx">keep the sessions apart,</span></div>
        <div class="cg" id="cg-12"><span class="tx">read every diff,</span></div>
        <div class="cg" id="cg-13"><span class="tx">and decide when it&#x27;s tested enough.</span></div>
        <div class="cg" id="cg-14"><span class="tx">VibeSwitcher turns that</span></div>
        <div class="cg" id="cg-15"><span class="tx">process into software.</span></div>
        <div class="cg" id="cg-16"><span class="tx">You talk to one session:</span></div>
        <div class="cg" id="cg-17"><span class="tx">the lead, one per repository.</span></div>
        <div class="cg" id="cg-18"><span class="tx">It plans the work,</span></div>
        <div class="cg" id="cg-19"><span class="tx">starts the workers,</span></div>
        <div class="cg" id="cg-20"><span class="tx">judges what comes back,</span></div>
        <div class="cg" id="cg-21"><span class="tx">and merges it.</span></div>
        <div class="cg" id="cg-22"><span class="tx">It never edits code itself.</span></div>
        <div class="cg" id="cg-23"><span class="tx">Workers, Claude or Codex,</span></div>
        <div class="cg" id="cg-24"><span class="tx">take one task each,</span></div>
        <div class="cg" id="cg-25"><span class="tx">and a read-only verifier checks them.</span></div>
        <div class="cg" id="cg-26"><span class="tx">You&#x27;re asked only what&#x27;s yours to decide:</span></div>
        <div class="cg" id="cg-27"><span class="tx">direction, taste,</span></div>
        <div class="cg" id="cg-28"><span class="tx">and anything you can&#x27;t undo.</span></div>
        <div class="cg" id="cg-29"><span class="tx">Every task starts as a contract:</span></div>
        <div class="cg" id="cg-30"><span class="tx">what must be true when it&#x27;s done,</span></div>
        <div class="cg" id="cg-31"><span class="tx">how the worker has to show it,</span></div>
        <div class="cg" id="cg-32"><span class="tx">and where it may make changes.</span></div>
        <div class="cg" id="cg-33"><span class="tx">The worker gets it word for word,</span></div>
        <div class="cg" id="cg-34"><span class="tx">with your working policy.</span></div>
        <div class="cg" id="cg-35"><span class="tx">And its hash is recorded with the merge.</span></div>
        <div class="cg" id="cg-36"><span class="tx">Workers run side by side,</span></div>
        <div class="cg" id="cg-37"><span class="tx">each in its own worktree and branch,</span></div>
        <div class="cg" id="cg-38"><span class="tx">so no two agents share a checkout.</span></div>
        <div class="cg" id="cg-39"><span class="tx">Up to three at a time, or seven with Boost.</span></div>
        <div class="cg" id="cg-40"><span class="tx">Claude Code&#x27;s own permission</span></div>
        <div class="cg" id="cg-41"><span class="tx">rules stop a worker from pushing,</span></div>
        <div class="cg" id="cg-42"><span class="tx">or touching the lead&#x27;s branch.</span></div>
        <div class="cg" id="cg-43"><span class="tx">To catch up, it merges the base in.</span></div>
        <div class="cg" id="cg-44"><span class="tx">A worker owns its task to the end.</span></div>
        <div class="cg" id="cg-45"><span class="tx">It marks its milestones,</span></div>
        <div class="cg" id="cg-46"><span class="tx">asks the lead only about direction,</span></div>
        <div class="cg" id="cg-47"><span class="tx">scope or risk,</span></div>
        <div class="cg" id="cg-48"><span class="tx">and proves new tests under load.</span></div>
        <div class="cg" id="cg-49"><span class="tx">When it says it&#x27;s done,</span></div>
        <div class="cg" id="cg-50"><span class="tx">it brings evidence for every check,</span></div>
        <div class="cg" id="cg-51"><span class="tx">or the report is refused.</span></div>
        <div class="cg" id="cg-52"><span class="tx">Not every change needs an audit.</span></div>
        <div class="cg" id="cg-53"><span class="tx">By default, the merge&#x27;s</span></div>
        <div class="cg" id="cg-54"><span class="tx">full test run is the check,</span></div>
        <div class="cg" id="cg-55"><span class="tx">and a small task,</span></div>
        <div class="cg" id="cg-56"><span class="tx">done in under thirty minutes</span></div>
        <div class="cg" id="cg-57"><span class="tx">and touching nothing sensitive,</span></div>
        <div class="cg" id="cg-58"><span class="tx">merges on its tests too.</span></div>
        <div class="cg" id="cg-59"><span class="tx">But sensitive paths,</span></div>
        <div class="cg" id="cg-60"><span class="tx">risky changes and a random ten percent</span></div>
        <div class="cg" id="cg-61"><span class="tx">sample are always raised to an audit,</span></div>
        <div class="cg" id="cg-62"><span class="tx">and nothing can lower that.</span></div>
        <div class="cg" id="cg-63"><span class="tx">So far, <span class="n">271</span> of <span class="n">495</span> merges were audited.</span></div>
        <div class="cg" id="cg-64"><span class="tx">The audit is independent.</span></div>
        <div class="cg" id="cg-65"><span class="tx">A read-only verifier</span></div>

        <div class="cg" id="cg-73"><span class="tx">Then a finding stays open</span></div>

        <div class="cg" id="cg-75"><span class="tx">An Important finding blocks</span></div>
        <div class="cg" id="cg-76"><span class="tx">the merge until it&#x27;s fixed,</span></div>

        <div class="cg" id="cg-78"><span class="tx">A nit never blocks.</span></div>
        <div class="cg" id="cg-79"><span class="tx">Each fix gets a round that</span></div>
        <div class="cg" id="cg-80"><span class="tx">checks only those findings.</span></div>
        <div class="cg" id="cg-81"><span class="tx">After two failed rounds,</span></div>
        <div class="cg" id="cg-82"><span class="tx">there&#x27;s no third:</span></div>
        <div class="cg" id="cg-83"><span class="tx">the lead re-plans,</span></div>
        <div class="cg" id="cg-84"><span class="tx">asks you, or re-rolls the</span></div>
        <div class="cg" id="cg-85"><span class="tx">task with a fresh worker.</span></div>
        <div class="cg" id="cg-86"><span class="tx">Then comes the merge gate.</span></div>
        <div class="cg" id="cg-87"><span class="tx">It takes exactly the</span></div>
        <div class="cg" id="cg-88"><span class="tx">commit that was checked,</span></div>
        <div class="cg" id="cg-89"><span class="tx">rebases it where no agent is working,</span></div>
        <div class="cg" id="cg-90"><span class="tx">runs the full suite,</span></div>
        <div class="cg" id="cg-91"><span class="tx">and only then fast-forwards.</span></div>
        <div class="cg" id="cg-92"><span class="tx">Never a merge commit,</span></div>
        <div class="cg" id="cg-93"><span class="tx">and never forced,</span></div>
        <div class="cg" id="cg-94"><span class="tx">so any merge can be undone with one revert.</span></div>
        <div class="cg" id="cg-95"><span class="tx">Tests misbehave, so the gate plans for it.</span></div>
        <div class="cg" id="cg-96"><span class="tx">A failing test gets one more run,</span></div>
        <div class="cg" id="cg-97"><span class="tx">and if it passes,</span></div>
        <div class="cg" id="cg-98"><span class="tx">it&#x27;s recorded as a flake.</span></div>
        <div class="cg" id="cg-99"><span class="tx">A run that goes silent is stopped,</span></div>
        <div class="cg" id="cg-100"><span class="tx">and the last test it started is named.</span></div>
        <div class="cg" id="cg-101"><span class="tx"><span class="n">495</span> merges, every one tested at the gate.</span></div>
        <div class="cg" id="cg-102"><span class="tx">Zero reverts.</span></div>
        <div class="cg" id="cg-103"><span class="tx">Merges got faster, too.</span></div>
        <div class="cg" id="cg-104"><span class="tx">A merge&#x27;s test run takes</span></div>
        <div class="cg" id="cg-105"><span class="tx">whatever cores are free,</span></div>
        <div class="cg" id="cg-106"><span class="tx">and only the failing tests run again.</span></div>
        <div class="cg" id="cg-107"><span class="tx">A test that&#x27;s red on main as well</span></div>
        <div class="cg" id="cg-108"><span class="tx">doesn&#x27;t send the branch back:</span></div>
        <div class="cg" id="cg-109"><span class="tx">it merges, and a task to</span></div>
        <div class="cg" id="cg-110"><span class="tx">fix that test is filed.</span></div>
        <div class="cg" id="cg-111"><span class="tx">And when finished work stops landing,</span></div>
        <div class="cg" id="cg-112"><span class="tx">the lead is told why:</span></div>
        <div class="cg" id="cg-113"><span class="tx">main is red, the slots are full,</span></div>
        <div class="cg" id="cg-114"><span class="tx">or the Mac is loaded,</span></div>
        <div class="cg" id="cg-115"><span class="tx">asleep, or on battery.</span></div>
        <div class="cg" id="cg-116"><span class="tx">Between steps, the board moves on its own.</span></div>
        <div class="cg" id="cg-117"><span class="tx">A done report starts the audit or the merge,</span></div>
        <div class="cg" id="cg-118"><span class="tx">findings go back to the worker,</span></div>
        <div class="cg" id="cg-119"><span class="tx">and the next task in line begins.</span></div>
        <div class="cg" id="cg-120"><span class="tx">It never moves a task the lead is holding.</span></div>
        <div class="cg" id="cg-121"><span class="tx">And you choose the merge policy.</span></div>
        <div class="cg" id="cg-122"><span class="tx">When something goes wrong,</span></div>
        <div class="cg" id="cg-123"><span class="tx">it becomes a check.</span></div>
        <div class="cg" id="cg-124"><span class="tx">In November, hung test runs held a</span></div>
        <div class="cg" id="cg-125"><span class="tx">shared test slot for up to an hour,</span></div>
        <div class="cg" id="cg-126"><span class="tx">five times in two days.</span></div>
        <div class="cg" id="cg-127"><span class="tx">That became a rule:</span></div>
        <div class="cg" id="cg-128"><span class="tx">a run with no output,</span></div>
        <div class="cg" id="cg-129"><span class="tx">and next to no CPU,</span></div>
        <div class="cg" id="cg-130"><span class="tx">for ten minutes, is stopped.</span></div>
        <div class="cg" id="cg-131"><span class="tx">All <span class="n">21</span> incidents on record</span></div>
        <div class="cg" id="cg-132"><span class="tx">became check tasks.</span></div>
        <div class="cg" id="cg-133"><span class="tx">The app is held to the same standard.</span></div>
        <div class="cg" id="cg-134"><span class="tx">UI journeys drive the real app in a sandbox,</span></div>
        <div class="cg" id="cg-135"><span class="tx">and compare each screenshot</span></div>
        <div class="cg" id="cg-136"><span class="tx">with its baseline.</span></div>
        <div class="cg" id="cg-137"><span class="tx">A health watcher groups the app&#x27;s</span></div>
        <div class="cg" id="cg-138"><span class="tx">own freezes and errors by cause,</span></div>
        <div class="cg" id="cg-139"><span class="tx">and proposes a task when</span></div>
        <div class="cg" id="cg-140"><span class="tx">one keeps coming back.</span></div>
        <div class="cg" id="cg-141"><span class="tx">And memory is measured:</span></div>
        <div class="cg" id="cg-142"><span class="tx">on macOS 27.2,</span></div>
        <div class="cg" id="cg-143"><span class="tx">freed memory now goes back at once,</span></div>
        <div class="cg" id="cg-144"><span class="tx">and an image-heavy chat adds</span></div>
        <div class="cg" id="cg-145"><span class="tx"><span class="n">178</span> megabytes at its peak,</span></div>
        <div class="cg" id="cg-146"><span class="tx">down from about a gigabyte.</span></div>
        <div class="cg" id="cg-147"><span class="tx">The Mac is shared,</span></div>
        <div class="cg" id="cg-148"><span class="tx">and the account is finite,</span></div>
        <div class="cg" id="cg-149"><span class="tx">so both are budgeted.</span></div>
        <div class="cg" id="cg-150"><span class="tx">Each task has a budget of working time.</span></div>
        <div class="cg" id="cg-151"><span class="tx">When it runs out,</span></div>
        <div class="cg" id="cg-152"><span class="tx">nothing is killed:</span></div>
        <div class="cg" id="cg-153"><span class="tx">the worker commits what works,</span></div>
        <div class="cg" id="cg-154"><span class="tx">and proposes what&#x27;s next.</span></div>
        <div class="cg" id="cg-155"><span class="tx">A witness tells the lead</span></div>
        <div class="cg" id="cg-156"><span class="tx">when a session goes quiet.</span></div>
        <div class="cg" id="cg-157"><span class="tx">Heavy jobs take turns in shared slots,</span></div>
        <div class="cg" id="cg-158"><span class="tx">and new work holds off on low battery,</span></div>
        <div class="cg" id="cg-159"><span class="tx">or near a usage limit.</span></div>
        <div class="cg" id="cg-160"><span class="tx">Each role gets a model that suits it.</span></div>
        <div class="cg" id="cg-161"><span class="tx">Fable leads, advises on hard tasks,</span></div>
        <div class="cg" id="cg-162"><span class="tx">takes re-rolls,</span></div>
        <div class="cg" id="cg-163"><span class="tx">and audits anything sensitive.</span></div>
        <div class="cg" id="cg-164"><span class="tx">In this project,</span></div>
        <div class="cg" id="cg-165"><span class="tx">Opus does the work and the routine audits.</span></div>
        <div class="cg" id="cg-166"><span class="tx">Codex takes bounded,</span></div>
        <div class="cg" id="cg-167"><span class="tx">mechanical tasks:</span></div>
        <div class="cg" id="cg-168"><span class="tx">with agent set to auto,</span></div>
        <div class="cg" id="cg-169"><span class="tx">it&#x27;s picked when Claude&#x27;s limits run tight,</span></div>
        <div class="cg" id="cg-170"><span class="tx">and a Claude verifier</span></div>
        <div class="cg" id="cg-171"><span class="tx">always audits its work.</span></div>
        <div class="cg" id="cg-172"><span class="tx">And when Fable reaches its usage limit,</span></div>

        <div class="cg" id="cg-176"><span class="tx">The project&#x27;s memory</span></div>
        <div class="cg" id="cg-177"><span class="tx">lives in the repository:</span></div>
        <div class="cg" id="cg-178"><span class="tx">decisions with their reasons,</span></div>
        <div class="cg" id="cg-179"><span class="tx">progress, and incidents.</span></div>
        <div class="cg" id="cg-180"><span class="tx">The tool server commits them,</span></div>
        <div class="cg" id="cg-181"><span class="tx">and workers can&#x27;t edit them.</span></div>
        <div class="cg" id="cg-182"><span class="tx">A new lead reads them first.</span></div>
        <div class="cg" id="cg-183"><span class="tx">And every merge records its task,</span></div>
        <div class="cg" id="cg-184"><span class="tx">its review, its models,</span></div>
        <div class="cg" id="cg-185"><span class="tx">and its contract.</span></div>
        <div class="cg" id="cg-186"><span class="tx">And you keep the keys.</span></div>
        <div class="cg" id="cg-187"><span class="tx">You set the review floor,</span></div>
        <div class="cg" id="cg-188"><span class="tx">the sensitive paths and the merge policy,</span></div>
        <div class="cg" id="cg-189"><span class="tx">and an approval covers one exact commit.</span></div>
        <div class="cg" id="cg-190"><span class="tx">Pushes, installs and wallet</span></div>
        <div class="cg" id="cg-191"><span class="tx">requests come to you as cards.</span></div>
        <div class="cg" id="cg-192"><span class="tx">A seal guards the configuration:</span></div>
        <div class="cg" id="cg-193"><span class="tx">a finished round of Claude Code&#x27;s own</span></div>
        <div class="cg" id="cg-194"><span class="tx">skill sync is let through by its shape,</span></div>
        <div class="cg" id="cg-195"><span class="tx">and every other change</span></div>
        <div class="cg" id="cg-196"><span class="tx">still waits for your click.</span></div>
        <div class="cg" id="cg-197"><span class="tx">And your phone can follow along,</span></div>
        <div class="cg" id="cg-198"><span class="tx">with replies behind their own switch.</span></div>
        <div class="cg" id="cg-199"><span class="tx">Day to day, it looks after you as well.</span></div>
        <div class="cg" id="cg-200"><span class="tx">After a Mac restart,</span></div>
        <div class="cg" id="cg-201"><span class="tx">one card offers to reopen</span></div>
        <div class="cg" id="cg-202"><span class="tx">the sessions you had open,</span></div>
        <div class="cg" id="cg-203"><span class="tx">leads first, and nothing</span></div>
        <div class="cg" id="cg-204"><span class="tx">reopens until you click.</span></div>
        <div class="cg" id="cg-205"><span class="tx">The chat&#x27;s model chip follows</span></div>
        <div class="cg" id="cg-206"><span class="tx">/model the moment you switch.</span></div>
        <div class="cg" id="cg-207"><span class="tx">A Run card tells the session that</span></div>
        <div class="cg" id="cg-208"><span class="tx">asked how its command ended.</span></div>
        <div class="cg" id="cg-209"><span class="tx">And every six hours,</span></div>
        <div class="cg" id="cg-210"><span class="tx">the app checks GitHub and this Mac&#x27;s</span></div>
        <div class="cg" id="cg-211"><span class="tx">main for a newer VibeSwitcher,</span></div>
        <div class="cg" id="cg-212"><span class="tx">and says what changed in plain words.</span></div>
        <div class="cg" id="cg-213"><span class="tx">Install and Restart asks for</span></div>
        <div class="cg" id="cg-214"><span class="tx">the signing password each time,</span></div>
        <div class="cg" id="cg-215"><span class="tx">and never stores it.</span></div>
        <div class="cg" id="cg-216"><span class="tx">If GitHub is ahead,</span></div>
        <div class="cg" id="cg-217"><span class="tx">the lead first merges it</span></div>
        <div class="cg" id="cg-218"><span class="tx">in and tests the result.</span></div>
        <div class="cg" id="cg-219"><span class="tx">So what does this add</span></div>
        <div class="cg" id="cg-220"><span class="tx">to Claude Code by hand?</span></div>
        <div class="cg" id="cg-221"><span class="tx">Planning becomes contracts on a board.</span></div>
        <div class="cg" id="cg-222"><span class="tx">Parallel work gets a worktree per task.</span></div>
        <div class="cg" id="cg-223"><span class="tx">Review gets an independent verifier,</span></div>
        <div class="cg" id="cg-224"><span class="tx">merging gets a gate,</span></div>
        <div class="cg" id="cg-225"><span class="tx">and mistakes become checks.</span></div>
        <div class="cg" id="cg-226"><span class="tx">The Mac&#x27;s load and limits are watched,</span></div>
        <div class="cg" id="cg-227"><span class="tx">and memory lives in git.</span></div>
        <div class="cg" id="cg-228"><span class="tx">And you&#x27;re asked only</span></div>
        <div class="cg" id="cg-229"><span class="tx">what&#x27;s yours to decide.</span></div>
        <div class="cg" id="cg-230"><span class="tx">Underneath, it&#x27;s the same Claude Code.</span></div>
        <div class="cg" id="cg-231"><span class="tx">Its permission rules,</span></div>
        <div class="cg" id="cg-232"><span class="tx">hooks and status line are</span></div>
        <div class="cg" id="cg-233"><span class="tx">how VibeSwitcher works.</span></div>
        <div class="cg" id="cg-234"><span class="tx">In under four weeks on this repository,</span></div>
        <div class="cg" id="cg-235"><span class="tx"><span class="n">495</span> tasks merged,</span></div>
        <div class="cg" id="cg-236"><span class="tx">every one tested at the gate.</span></div>
        <div class="cg" id="cg-237"><span class="tx"><span class="n">82</span> Important findings fixed before merge.</span></div>
        <div class="cg" id="cg-238"><span class="tx">Zero reverts.</span></div>
        <div class="cg" id="cg-239"><span class="tx">You decide what to build.</span></div>
        <div class="cg" id="cg-240"><span class="tx">The system runs the process.</span></div>
      </div>
      <script>
